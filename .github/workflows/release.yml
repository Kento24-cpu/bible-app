name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  build:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check tag is on main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME points to a commit that is not on main"
            exit 1
          fi

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./app.json').expo.version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "app.json version ($version) does not match tag ($GITHUB_REF_NAME)"
            exit 1
          fi

      - name: Build production APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx --yes eas-cli@27 build --platform android --profile production --non-interactive --wait --json > build.json
          node -e "const [b] = require('./build.json'); console.log('EAS build:', b.artifacts.buildUrl)"

      - name: Download APK
        run: |
          url=$(node -p "require('./build.json')[0].artifacts.applicationArchiveUrl")
          version=$(node -p "require('./app.json').expo.version")
          curl -fsSL "$url" -o "bible-app-$version.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: '*.apk'

      - name: Publish OTA update to production channel
        if: startsWith(github.ref, 'refs/tags/')
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@27 update --channel production --environment production --message "$GITHUB_REF_NAME" --non-interactive

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    env:
      LANDING_SYNC_TOKEN: ${{ secrets.LANDING_SYNC_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" ./*.apk --title "$GITHUB_REF_NAME" --generate-notes

      - name: Sync landing page
        if: env.LANDING_SYNC_TOKEN != ''
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer $LANDING_SYNC_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "{\"event_type\":\"app-release\",\"client_payload\":{\"version\":\"${GITHUB_REF_NAME#v}\"}}" \
            "$GITHUB_API_URL/repos/Kento24-cpu/bible-landing/dispatches"
