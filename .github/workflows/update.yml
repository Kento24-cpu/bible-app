name: OTA update

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'assets/**'
      - 'global.css'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: ota-update
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Publish OTA update to production channel
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: npx --yes eas-cli@27 update --channel production --environment production --message "$GITHUB_SHA" --non-interactive
